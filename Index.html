function lvl(){state='end';hidePads();qm.visible=false;$('q').style.display='none';const n=qi/10,got=stars-lvS;lvS=stars;
 $('ov').innerHTML=`<h1>🎉 Level ${n} selesai!</h1><div style="font-size:48px">🏅</div><p>${LV[n-1]}<br>${'⭐'.repeat(got)||'—'}<br>${got} dari 10</p><button class="go" onclick="nextLv()">▶ Lanjut</button><button class="go" style="background:#ffd54f;color:#333;box-shadow:0 5px 0 #c9a227" onclick="toMenu()">🏠 Menu</button>`;$('ov').style.display='block';say('Level complete! Well done!')}
function nextLv(){$('ov').style.display='none';mode==='adv'?goWalk():loadQ()}
function dirT(){const c=THREE.MathUtils.clamp,gx=girl.position.x,gz=girl.position.z;if(mode==='adv')tgt.set(gx+kx*3,0,gz+kz*3);else tgt.set(c(gx+kx*3,-8,8),0,c(gz+kz*3,-7,12))}
function hold(x,z){kx=x;kz=z;if(!x&&!z)tgt.set(girl.position.x,0,girl.position.z)}
document.querySelectorAll('#dp button').forEach(b=>{const x=+b.dataset.x,z=+b.dataset.z;b.addEventListener('pointerdown',e=>{e.preventDefault();hold(x,z)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>hold(0,0)))});
const KM={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
addEventListener('keydown',e=>{const m=KM[e.key];if(m){e.preventDefault();hold(m[0],m[1])}});
addEventListener('keyup',e=>{if(KM[e.key])hold(0,0)});
function toMenu(){clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}state='intro';hold(0,0);$('q').style.display='none';hidePads();qm.visible=false;QZ.visible=true;AD.visible=false;girl.position.set(0,0,6);girl.rotation.y=0;tgt.set(0,0,6);$('ov').innerHTML=MENU;$('ov').style.display='block'}
const MENU=`<h1>🦁 Lily di Kebun Binatang</h1><p>Gerakkan kursor (atau geser jari) supaya Lily berjalan. Ada 30 pertanyaan: Animals, Numbers, dan Body!</p><button class="go" onclick="start('adv')">🧭 Mode Petualangan</button><button class="go" style="background:#ff8fb8;box-shadow:0 5px 0 #d6608a" onclick="start('quiz')">🎯 Mode Kuis</button>`;
$('ov').innerHTML=MENU;QZ.visible=true;AD.visible=false;qm.visible=false;
function say(w){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.75;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}}
function sayQ(){say(cur.s+' '+cur.p)}
function hud(){$('hud').textContent='⭐ '+stars}
function start(m){mode=m;$('ov').style.display='none';QZ.visible=m==='quiz';AD.visible=m==='adv';Q=build();qi=0;stars=0;lvS=0;dw=0;dwp=-1;pads.forEach(p=>p.y=0);hud();
 if(m==='adv'){girl.position.set(0,0,4);tgt.set(0,0,4);girl.rotation.y=0;hidePads();goWalk();say('Let us go on an adventure!')}else loadQ()}
function goWalk(){qm.position.set(SP[qi].x,hgt(SP[qi].x,SP[qi].z),SP[qi].z);qm.visible=true;state='walk';
 $('q').innerHTML=`<div class="ct">${Q[qi].c} · ${qi+1}/30</div><div class="s">🧭 Ayo jalan ke ❓ <span id="ar"></span></div><div class="hint" id="tg">Gerakkan kursor atau geser jari</div>`;$('q').style.display='block'}
function loadQ(){cur=Q[qi];qm.visible=false;
 if(mode==='adv')putAdv(qi);else{putPads(0,-4,5.5);girl.position.set(0,0,6);tgt.set(0,0,6);girl.rotation.y=0}
 pads.forEach((p,i)=>{lab(p,cur.o[i]);p.d.material.color.set(COL[i])});tries=0;cool=-1;dw=0;dwp=-1;
 $('q').innerHTML=`<div class="ct">${cur.c} · ${qi+1}/30</div>${cur.pic?`<div class="pic">${cur.pic}</div>`:''}<div class="s">${cur.s}</div><div class="pr">${cur.p}<button class="sp" onclick="sayQ()">🔊</button></div><div class="hint">Ketuk gambar jawaban, lalu Lily berjalan ke sana!</div>`;
 $('q').style.display='block';state='play';sayQ()}
function answer(i){const o=cur.o[i];
 if(!o.ok){tries++;pads[i].fl=t+.6;const q=$('q');q.classList.remove('bad');void q.offsetWidth;q.classList.add('bad');say(tries>=2?'Look at the blinking circle!':'Try again!');return}
 state='ok';if(!tries)stars++;hud();
 $('q').innerHTML=`<div class="big">🎉 Great!</div><div class="s">${cur.e} ${cur.w}</div>`;say('Great! '+cur.w);
 tm=setTimeout(()=>{qi++;if(qi>=Q.length)finish();else if(qi%10===0)lvl();else if(mode==='adv'){hidePads();goWalk()}else loadQ()},1900)}
function finish(){state='end';$('q').style.display='none';
 $('ov').innerHTML=`<h1>🏆 Hebat sekali!</h1><p>Lily mendapat ${stars} ⭐ dari 30 pertanyaan</p><button class="go" onclick="again()">🔄 Main lagi</button>`;$('ov').style.display='block';say('Well done! You are a star!')}
function again(){$('ov').innerHTML=MENU}
// cursor control
const rc=new THREE.Raycaster(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),0),v3=new THREE.Vector3();
function setT(e){if(state!=='play'&&state!=='walk')return;pl.constant=mode==='adv'?-hgt(girl.position.x,girl.position.z):0;rc.setFromCamera({x:e.clientX/innerWidth*2-1,y:-e.clientY/innerHeight*2+1},cam);
 if(rc.ray.intersectPlane(pl,v3)){const c=THREE.MathUtils.clamp,gz=girl.position.z;
  if(mode==='adv')tgt.set(c(v3.x,girl.position.x-25,girl.position.x+25),0,c(v3.z,gz-25,gz+25));else tgt.set(c(v3.x,-8,8),0,c(v3.z,-7,12))}}
ren.domElement.addEventListener('pointermove',setT);ren.domElement.addEventListener('pointerdown',e=>{setT(e);tapPad(e)});
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;let mv=false;
 if((state==='play'||state==='walk')&&(kx||kz))dirT();
 if(state==='play'||state==='walk'){const dx=tgt.x-girl.position.x,dz=tgt.z-girl.position.z,d=Math.hypot(dx,dz);
  if(d>.15){const s=Math.min(d,spd()*dt);girl.position.x+=dx/d*s;girl.position.z+=dz/d*s;girl.rotation.y=Math.atan2(-dx,-dz);mv=true;const w=Math.sin(t*12)*.7;legL.rotation.x=w;legR.rotation.x=-w;girl.position.y=Math.abs(Math.sin(t*12))*.08}
  mark.visible=mv;mark.position.set(tgt.x,.05,tgt.z);
  if(state==='walk'){if(Math.hypot(girl.position.x-SP[qi].x,girl.position.z-SP[qi].z)<3)loadQ()}
  else{let ins=-1;pads.forEach((p,i)=>{if(Math.hypot(girl.position.x-p.x,girl.position.z-p.z)<2)ins=i});pin=ins;
   if(ins<0){cool=-1;dw=0;dwp=-1}else if(ins!==cool){if(ins!==dwp){dwp=ins;dw=0}dw+=dt;if(dw>=1){cool=ins;dw=0;answer(ins)}}}}
 else mark.visible=false;
 if(state==='ok'){girl.position.y=Math.abs(Math.sin(t*8))*.25;girl.rotation.y=Math.PI}
 else if(!mv){legL.rotation.x=legR.rotation.x=0;girl.position.y=0}
 pads.forEach((p,i)=>{const pr=state==='play'&&i===pin&&pin!==cool?Math.min(dw,1):0,hn=state==='play'&&tries>=2&&cur&&cur.o[i].ok,pu=hn?.08*Math.sin(t*8):0;
  p.d.material.color.set(t<(p.fl||0)?0xe53935:(hn&&Math.sin(t*8)>0?0x4cc36b:COL[i])).lerp(GRN,pr);p.d.scale.set(1+pr*.15+pu,1,1+pr*.15+pu);
  p.sp.scale.setScalar(3.6+pr*.5);p.sp.position.y=(p.y||0)+2.8+Math.sin(t*2+i)*.12});
 qm.children[1].position.y=2.8+Math.sin(t*3)*.3;
 zoo.forEach((a,i)=>a.rotation.y=Math.sin(t*.8+i)*.25);
 const ad=mode==='adv',gh=ad?hgt(girl.position.x,girl.position.z):0,sw=ad&&inW(girl.position.x,girl.position.z);
 girl.rotation.x+=((sw?-1.15:0)-girl.rotation.x)*Math.min(1,dt*8);
 if(sw){girl.position.y=.1+Math.sin(t*4)*.06;const kk=Math.sin(t*14)*.6;legL.rotation.x=kk;legR.rotation.x=-kk}else girl.position.y+=gh;
 let fx=0,fz=0;
 if(ad&&state==='walk'){const P=SP[qi],ex=P.x-girl.position.x,ez=P.z-girl.position.z,ar=$('ar');fx=THREE.MathUtils.clamp(ex,-8,8)*.5;fz=THREE.MathUtils.clamp(ez,-8,8)*.5;
  if(ar){ar.textContent=Math.abs(ex)>Math.abs(ez)?(ex>0?'➡️ kanan':'⬅️ kiri'):(ez<0?'⬆️ lurus':'⬇️ mundur');const g=$('tg'),tag=inW(P.x,P.z)?'🏊 Ada kolam, ayo berenang!':hgt(P.x,P.z)>1?'⛰️ Ayo naik bukit!':'Gerakkan kursor atau geser jari';if(g&&g.textContent!==tag)g.textContent=tag}}
 cox+=(fx-cox)*Math.min(1,dt*3);coz+=(fz-coz)*Math.min(1,dt*3);
 const cx=ad?girl.position.x+cox:girl.position.x*.4,cz=ad?girl.position.z+coz:girl.position.z,gy=ad?girl.position.y*.6:0;
 cam.position.set(cx,11+gy,cz+11);cam.lookAt(cx,gy,cz-6);
 ren.render(scene,cam);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
